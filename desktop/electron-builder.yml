appId: com.edgesidekick.desktop
productName: EdgeSidekick
copyright: Copyright © EdgeSidekick
asar: true
directories:
  output: dist
  buildResources: build
files:
  - main.mjs
  - preload.cjs
  - select-bootstrap.cjs
  - package.json
  - build/icon.png
win:
  icon: build/icon.png
  executableName: EdgeSidekick
  extraResources:
    - from: ../packaging/windows/payload
      to: sidekick
      filter:
        - "**/*"
        - "**/*.zip"
        - "**/*._pth"
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EdgeSidekick
  uninstallDisplayName: EdgeSidekick
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
    - en_US
  artifactName: ${productName}-Setup-${version}-win-${arch}.exe
linux:
  icon: build/icons
  category: Development
  executableName: edgesidekick
  synopsis: 本机多智能体 AI 工作台
  description: EdgeSidekick — 适配银河麒麟 / 通用 Linux 的本机多智能体工作台。
  # electron-builder 26: only { entry?, desktopActions? } are valid here.
  desktop:
    entry:
      Name: EdgeSidekick
      "Name[zh_CN]": EdgeSidekick
      Comment: 本机多智能体 AI 工作台
      Categories: Development;Office;
      Type: Application
      Terminal: "false"
      Icon: edgesidekick
  extraResources:
    - from: ../packaging/kylin/payload
      to: sidekick
      filter:
        - "**/*"
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-kylin-${arch}.${ext}
deb:
  afterInstall: build/linux-after-install.sh
  packageName: edgesidekick
  maintainer: EdgeSidekick
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
