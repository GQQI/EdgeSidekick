<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="EdgeSidekick architecture">
  <defs>
    <linearGradient id="eskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="eskArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background so dark pages still show a plate when used as img -->
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Clients group -->
  <rect x="24" y="24" width="220" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="40" y="48" fill="#2563eb" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Clients</text>
  <rect x="40" y="64" width="188" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="54" y="86" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Web UI</text>
  <text x="54" y="104" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">ui/ - Vite + React</text>
  <rect x="40" y="128" width="188" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="54" y="150" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Desktop shell</text>
  <text x="54" y="168" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">desktop/ - Electron</text>

  <!-- Backend group -->
  <rect x="300" y="24" width="360" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="316" y="48" fill="#2563eb" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Backend - python main.py</text>
  <rect x="316" y="64" width="328" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330" y="91" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">REST + SSE API - src/metateam/api</text>
  <rect x="316" y="124" width="328" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330" y="146" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Main agent</text>
  <text x="330" y="164" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">plan / tools / approval / compression</text>
  <rect x="316" y="196" width="152" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330" y="223" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Sub-agents</text>
  <rect x="492" y="196" width="152" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="506" y="223" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Browser sandbox</text>
  <rect x="316" y="252" width="328" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330" y="275" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">MCP servers / Plugins</text>

  <!-- Disk group -->
  <rect x="720" y="24" width="216" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="736" y="48" fill="#2563eb" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Local disk</text>
  <rect x="736" y="64" width="184" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="748" y="87" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Workspace folder</text>
  <rect x="736" y="112" width="184" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="748" y="135" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Skills</text>
  <rect x="736" y="160" width="184" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="748" y="183" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Memory (MEMORY.md)</text>
  <rect x="736" y="208" width="184" height="24" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="748" y="224" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Runtime data / model config</text>

  <!-- LLM -->
  <rect x="300" y="340" width="360" height="52" rx="12" fill="url(#eskGrad)"/>
  <text x="480" y="362" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Your model API</text>
  <text x="480" y="380" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">OpenAI-compatible / DeepSeek / Ollama</text>

  <!-- arrows -->
  <line x1="244" y1="90" x2="300" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="244" y1="154" x2="300" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="480" y1="108" x2="480" y2="124" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="400" y1="180" x2="400" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="560" y1="180" x2="560" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="480" y1="240" x2="480" y2="252" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="660" y1="152" x2="720" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
  <line x1="480" y1="304" x2="480" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#eskArr)"/>
</svg>
